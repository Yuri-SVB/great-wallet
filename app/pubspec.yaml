name: great_wallet_app
description: >-
  Great Wallet — the unified end-user application. This package is the
  app-level orchestration layer that wires the ecosystem libraries together.
  It currently implements the Setup mode by integrating great-wall-ux
  (rendering / interaction) with great-wall-core (the fractal encoder engine)
  over the engine's C ABI. See great-wall-docs/great-wallet/ARCHITECTURE.md.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The visual and interaction layer. Provided by the consuming app as a
  # flat submodule of great-wallet (great-wall-docs ARCHITECTURE.md §"Submodule
  # Rules": only the app repo carries submodules, one level deep). great-wall-ux
  # itself submodules nothing — this app pins it.
  great_wall_ux:
    path: ../great-wall-ux

  # The memory engine: the deck of memorised maps, its SM-2 schedule and the
  # maps' landmark cues. Pure Dart; a flat submodule pinned by this app, like
  # great-wall-ux.
  celestial_peace_nf_core:
    path: ../celestial-peace-nf-core

  # Foreign-function interface helpers (calloc / free for the per-frame
  # escape-count pixel buffer). The raw dart:ffi binding to the Rust core's
  # C ABI lives in lib/src/ffi (TECH_STACK.md §"FFI: hybrid" — raw dart:ffi on
  # the hot pixel-buffer path).
  ffi: ^2.1.0

  # SHA-256 for the (o, p, q) derivation from the Argon2 digest. Mirrors
  # great-wall-core/burning_ship/argon2_pipeline.py: derive_stage2_params().
  crypto: ^3.0.3

  # AES-256-GCM (NIST SP 800-38D) + Argon2id (RFC 9106) for the provisional-key
  # vault's password encryption. Deliberately conventional, vetted primitives;
  # pure-Dart implementations, so no platform plugins are required. See
  # lib/src/setup/setup_crypto.dart.
  cryptography: ^2.7.0

  # The app's data folder, where the sound-cue folder lives by default (see
  # lib/src/app/sound_cue_folder.dart). Already in the build through
  # audioplayers; named here because the app uses it directly.
  path_provider: ^2.1.0

  # QR module matrix for the provisional-key code. The 16-byte key is encoded in
  # byte mode (so it rides a v1 21x21 symbol), which qr_flutter's string-only API
  # can't express, so we build the matrix with the qr package and render both the
  # scannable code and the hand-fill template ourselves with a CustomPainter.
  qr: ^3.0.0

  # Webcam scanning of the provisional-key QR on the platforms its authors
  # support (Android / iOS / macOS / web). Camera permission entries must be
  # added to the app's platform configs.
  mobile_scanner: ^5.2.3

  # Desktop (Linux / Windows) live-webcam scanning of the provisional-key QR,
  # where mobile_scanner has no backend. flutter_webrtc drives the camera and
  # zxing2 (pure Dart) decodes grabbed frames. Best-effort: desktop camera
  # support in flutter_webrtc is young, so failures degrade to hex-load. See
  # lib/src/setup/desktop_qr_scanner.dart.
  flutter_webrtc: ^1.5.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: false
  uses-material-design: true
